<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100%" height="100%">
  <style>
    .bun-top { fill: #E88D33; }
    .bun-bottom { fill: #E88D33; }
    .filling { fill: #C83226; }
    
    @media (prefers-color-scheme: dark) {
      .bun-top { fill: #FFA347; }
      .bun-bottom { fill: #FFA347; }
      .filling { fill: #FF4D3D; }
    }
  </style>

  <!-- Pan superior -->
  <path class="bun-top" d="M16,42 C16,22 32,14 50,14 C68,14 84,22 84,42 C84,45 81,46 78,46 L22,46 C19,46 16,45 16,42 Z" />
  
  <!-- Sésamo / Semillas opcionales -->
