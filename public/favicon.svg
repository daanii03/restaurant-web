  <ellipse cx="50" cy="24" rx="2.5" ry="1.5" fill="#FFFFFF" opacity="0.8" />
  <ellipse cx="64" cy="30" rx="2.5" ry="1.5" fill="#FFFFFF" opacity="0.8" />

  <!-- Relleno (Queso / Carne) -->
  <path class="filling" d="M14,52 C14,50 16,49 18,49 L82,49 C84,49 86,50 86,52 C86,57 80,59 75,59 C70,59 67,56 62,56 C57,56 54,60 48,60 C42,60 39,56 34,56 C29,56 26,59 21,59 C16,59 14,57 14,52 Z" />

  <!-- Pan inferior -->
